<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>竹斬 リアルサムライ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sumi:#16120f; --ai:#2e3d63; --shu:#b8332a; --kin:#c9a45c; --washi:#ece3cf; --take:#56702a;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --gothic:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --washi:#e8dfca; } }
:root[data-theme="dark"]{ --washi:#e8dfca; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; height:100%; overflow:hidden; }
body{ background:#2a1c22; font-family:var(--gothic); color:var(--washi);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; overscroll-behavior:none; }
#gl,#ink{ position:fixed; inset:0; width:100%; height:100%; display:block; }
#ink{ z-index:2; touch-action:none; }
button{ font:inherit; cursor:pointer; }
button:focus-visible{ outline:3px solid var(--kin); outline-offset:3px; }

#hud{ position:fixed; z-index:5; top:calc(env(safe-area-inset-top,0px) + 12px); left:16px; right:16px;
  display:flex; justify-content:space-between; align-items:baseline; pointer-events:none;
  font-family:var(--mincho); font-weight:600; font-size:15px; letter-spacing:.08em;
  text-shadow:0 1px 8px rgba(0,0,0,.7); transition:opacity .4s; }
#best{ font-size:13px; opacity:.85; }
#slate{ position:fixed; z-index:6; left:0; right:0; top:34%; text-align:center; pointer-events:none;
  font-family:var(--mincho); font-weight:800; font-size:clamp(26px,7vw,44px); letter-spacing:.14em;
  text-shadow:0 3px 18px rgba(0,0,0,.8); opacity:0; transform:scale(.96); transition:opacity .25s, transform .25s; }
#slate.on{ opacity:1; transform:none; }
#hint{ position:fixed; z-index:5; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 128px); margin:0;
  text-align:center; font-family:var(--mincho); font-size:18px; letter-spacing:.3em; pointer-events:none;
  opacity:0; transition:opacity .5s; text-shadow:0 2px 10px rgba(0,0,0,.8); }
#hint.on{ opacity:.92; }

#crew{ position:fixed; z-index:6; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  display:grid; grid-template-columns:repeat(3,1fr); padding:0 8px; pointer-events:none; transition:opacity .4s; }
.seat{ margin:0; display:flex; flex-direction:column; align-items:center; position:relative; }
.seat blockquote{ position:absolute; bottom:64px; width:min(31vw,190px); margin:0; padding:8px 10px;
  background:var(--washi); color:var(--sumi); font-family:var(--mincho); font-weight:600; font-size:14px; line-height:1.5;
  box-shadow:0 8px 22px rgba(0,0,0,.4); opacity:0; transform:translateY(10px); transition:opacity .25s, transform .25s; }
.seat blockquote.on{ opacity:1; transform:none; }
.seat blockquote::after{ content:""; position:absolute; left:50%; bottom:-7px; margin-left:-7px;
  border:7px solid transparent; border-top-color:var(--washi); border-bottom:0; }
.face{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mincho); font-weight:800; font-size:17px; color:var(--washi); border:2px solid rgba(236,227,207,.75); }
.f0{ background:var(--shu); } .f1{ background:var(--ai); } .f2{ background:var(--take); }
.seat figcaption{ font-size:11px; margin-top:3px; letter-spacing:.1em; text-shadow:0 1px 4px rgba(0,0,0,.8); }

.bar{ position:fixed; left:0; right:0; z-index:4; height:0; background:#050404; transition:height .5s ease; pointer-events:none; }
.bar.t{ top:0; } .bar.b{ bottom:0; }
body.cine .bar.t{ height:calc(env(safe-area-inset-top,0px) + 11vh); }
body.cine .bar.b{ height:calc(env(safe-area-inset-bottom,0px) + 9vh); }
#monitor{ position:fixed; z-index:7; top:calc(env(safe-area-inset-top,0px) + 12px); left:16px; right:16px;
  display:flex; justify-content:space-between; font-size:12px; letter-spacing:.12em; opacity:0; transition:opacity .4s; pointer-events:none; }
body.cine #monitor{ opacity:.9; }
body.cine #hud{ opacity:0; }
#monitor .rec::before{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--shu); margin-right:8px; vertical-align:1px; animation:blink 1s steps(2) infinite; }
#tc{ font-variant-numeric:tabular-nums; }
@keyframes blink{ 50%{ opacity:0; } }
#skip{ position:fixed; z-index:8; right:14px; top:calc(env(safe-area-inset-top,0px) + 38px); padding:8px 12px;
  background:transparent; color:var(--washi); border:1px solid rgba(236,227,207,.55); font-size:12px; letter-spacing:.1em; }
#err{ position:fixed; z-index:30; left:10px; right:10px; top:calc(env(safe-area-inset-top,0px) + 60px); padding:10px 12px; background:#b8332a; color:#fff; font-size:13px; line-height:1.5; }
#err[hidden]{ display:none; }
#flash{ position:fixed; inset:0; z-index:3; background:#fff6e6; opacity:0; pointer-events:none; }

#title{ position:fixed; inset:0; z-index:10; display:grid; grid-template-columns:auto 1fr; align-items:end; gap:0 26px;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 26px calc(env(safe-area-inset-bottom,0px) + 36px);
  background:linear-gradient(90deg,rgba(20,12,16,.86),rgba(20,12,16,.4) 62%,rgba(20,12,16,0)); transition:opacity .5s; }
#title.gone{ opacity:0; pointer-events:none; }
.brand{ position:relative; align-self:center; }
#title h1{ writing-mode:vertical-rl; margin:0; font-family:var(--mincho); font-weight:800; line-height:1;
  font-size:clamp(92px,27vw,176px); letter-spacing:.04em; text-shadow:0 6px 30px rgba(0,0,0,.55); }
.seal{ position:absolute; right:-18px; bottom:-14px; width:42px; height:42px; display:grid; place-items:center;
  background:var(--shu); color:var(--washi); font-family:var(--mincho); font-weight:800; font-size:24px; transform:rotate(-5deg); }
.intro{ max-width:24em; padding-bottom:6px; }
.intro .sub{ margin:0 0 14px; font-family:var(--mincho); font-weight:800; font-size:20px; letter-spacing:.35em; color:var(--kin); }
.intro .lead{ margin:0 0 26px; font-size:15px; line-height:1.9; }
.btn{ font-family:var(--mincho); font-weight:800; font-size:19px; letter-spacing:.3em; padding:14px 24px 14px 30px;
  background:var(--washi); color:var(--sumi); border:0; border-radius:0; box-shadow:5px 5px 0 var(--shu); }
.btn:active{ transform:translate(3px,3px); box-shadow:2px 2px 0 var(--shu); }

#result{ position:fixed; inset:0; z-index:12; display:grid; place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
  background:rgba(14,9,11,.55); opacity:0; pointer-events:none; transition:opacity .35s; }
#result.show{ opacity:1; pointer-events:auto; }
.scroll{ width:min(560px,100%); max-height:100%; overflow:auto; background:var(--washi); color:var(--sumi);
  display:grid; grid-template-columns:auto 1fr; gap:16px; padding:20px 18px 18px 12px;
  border-top:7px solid var(--sumi); border-bottom:7px solid var(--sumi); box-shadow:0 24px 70px rgba(0,0,0,.55);
  transform:translateY(14px); transition:transform .35s; }
#result.show .scroll{ transform:none; }
.waza{ writing-mode:vertical-rl; font-family:var(--mincho); font-weight:800; font-size:clamp(40px,11vw,62px);
  line-height:1; letter-spacing:.12em; padding-right:12px; border-right:1px solid rgba(22,18,15,.22); }
.rbody{ min-width:0; }
.score{ display:flex; align-items:flex-start; gap:6px; font-family:var(--mincho); margin-bottom:10px; }
#rScore{ font-size:64px; font-weight:800; line-height:.9; font-variant-numeric:tabular-nums; }
.score small{ font-size:18px; font-weight:800; margin-top:30px; }
#rGrade{ margin-left:auto; writing-mode:vertical-rl; background:var(--shu); color:var(--washi);
  padding:8px 7px; font-weight:800; font-size:16px; letter-spacing:.18em; }
#rStats{ display:grid; grid-template-columns:auto 1fr; gap:6px 10px; margin:0 0 14px; font-size:13px; align-items:center; }
#rStats dt{ font-weight:700; }
#rStats dd{ margin:0; display:flex; align-items:center; gap:8px; }
#rStats dd i{ flex:1; height:6px; background:rgba(22,18,15,.12); position:relative; }
#rStats dd i span{ position:absolute; left:0; top:0; bottom:0; background:var(--shu); }
#rStats dd b{ width:2.2em; text-align:right; font-variant-numeric:tabular-nums; }
#rCrew{ list-style:none; margin:0 0 16px; padding:12px 0 0; border-top:1px solid rgba(22,18,15,.22); display:grid; gap:9px; }
#rCrew li{ display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; }
#rCrew .face{ width:30px; height:30px; font-size:13px; border-width:0; }
#rCrew p{ margin:0; font-family:var(--mincho); font-weight:600; font-size:15px; line-height:1.55; }
#rCrew p b{ display:block; font-family:var(--gothic); font-size:11px; font-weight:700; opacity:.6; letter-spacing:.08em; }
.btns{ display:flex; gap:10px; flex-wrap:wrap; }
.btns button{ flex:1 1 auto; padding:12px 14px; border:0; border-radius:0; font-family:var(--mincho); font-weight:800; font-size:15px; letter-spacing:.14em; }
#again{ background:transparent; color:var(--sumi); border:2px solid var(--sumi); }
#next{ background:var(--sumi); color:var(--washi); }

body[data-state="title"] #hud, body[data-state="title"] #crew{ opacity:0; }
@media (max-width:380px){ .seat blockquote{ font-size:13px; padding:7px 8px; } }
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.01ms !important; animation:none !important; } }
</style>
</head>
<body data-state="title">
<section id="title">
  <div class="brand"><h1>竹斬</h1><div class="seal">侍</div></div>
  <div class="intro">
    <p class="sub">リアルサムライ</p>
    <p class="lead">指でなぞった軌跡が、そのまま太刀筋になる。速く、まっすぐ、迷いなく。斬った一瞬は、撮影クルーがリプレイで見ている。</p>
    <button class="btn" id="start">構える</button>
  </div>
</section>
<canvas id="gl"></canvas>
<canvas id="ink"></canvas>
<div id="flash"></div>
<div class="bar t"></div><div class="bar b"></div>
<div id="monitor"><span class="rec">監督モニター　リプレイ</span><span id="tc">00:00:00:00</span></div>
<header id="hud"><div id="take">シーン1　テイク1</div><div id="best">自己ベスト　—</div></header>
<div id="slate"></div>
<p id="hint">画面をなぞって、斬る</p>
<section id="crew" aria-live="polite">
  <figure class="seat"><blockquote></blockquote><div class="face f0">監</div><figcaption>監督</figcaption></figure>
  <figure class="seat"><blockquote></blockquote><div class="face f1">助</div><figcaption>助監督</figcaption></figure>
  <figure class="seat"><blockquote></blockquote><div class="face f2">ア</div><figcaption>アシスタント</figcaption></figure>
</section>
<button id="skip" hidden>リプレイを飛ばす</button>

<section id="result" aria-live="polite">
  <div class="scroll">
    <div class="waza" id="rWaza">袈裟斬り</div>
    <div class="rbody">
      <div class="score"><span id="rScore">0</span><small>点</small><span id="rGrade">達人</span></div>
      <dl id="rStats"></dl>
      <ul id="rCrew"></ul>
      <div class="btns"><button id="again">もう一度撮る</button><button id="next">次のシーンへ</button></div>
    </div>
  </div>
</section>

<div id="err" hidden></div>
<script>
window.__showErr=function(m){var e=document.getElementById('err');if(!e||!e.hidden)return;e.hidden=false;e.textContent='エラー: '+m;};
window.addEventListener('error',function(ev){window.__showErr((ev.message||'')+' '+((ev.filename||'').split('/').pop())+':'+(ev.lineno||''));});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE)document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>
(function(){
'use strict';
if(!window.THREE){window.__showErr('3Dエンジン（three.js）を読み込めませんでした。通信状況を確認して再読み込みしてください');return;}
const $=s=>document.querySelector(s);
const V3=THREE.Vector3, Q=THREE.Quaternion;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIn=t=>t*t*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const UP=new V3(0,1,0), DOWN=new V3(0,-1,0);
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const store={best:0};
try{const s=localStorage.getItem('takegiri-best'); if(s) store.best=+s||0; store.kaguya=+(localStorage.getItem('takegiri-kaguya')||0)||0;}catch(e){}
function saveBest(){try{localStorage.setItem('takegiri-best',String(store.best));localStorage.setItem('takegiri-kaguya',String(store.kaguya||0));}catch(e){}}

/* ================= renderer ================= */
const mobilePerf=innerWidth<=480;
const renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:!mobilePerf,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobilePerf?1:2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.localClippingEnabled=true;
const scene=new THREE.Scene();
const HOR=new THREE.Color(0.80,0.43,0.31);
scene.fog=new THREE.Fog(HOR,7,34);
const camera=new THREE.PerspectiveCamera(40,1,0.03,140);

const skyMat=new THREE.ShaderMaterial({
  uniforms:{sunDir:{value:new V3(-0.55,0.07,-1).normalize()}},
  vertexShader:'varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:`uniform vec3 sunDir; varying vec3 vD;
  void main(){ float h=vD.y; vec3 top=vec3(0.10,0.07,0.17), mid=vec3(0.42,0.21,0.28), hor=vec3(0.80,0.43,0.31);
    vec3 c=mix(hor,mid,smoothstep(0.0,0.16,h)); c=mix(c,top,smoothstep(0.16,0.62,h)); if(h<0.0) c=hor;
    float s=max(dot(normalize(vD),sunDir),0.0);
    c+=vec3(1.0,0.78,0.5)*pow(s,500.0)*1.6+vec3(1.0,0.55,0.3)*pow(s,14.0)*0.35;
    gl_FragColor=vec4(c,1.0); }`,
  side:THREE.BackSide, depthWrite:false, fog:false
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(90,32,16),skyMat));
const pmrem=new THREE.PMREMGenerator(renderer);
const envScene=new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10,32,16),skyMat));
let envTex=null; try{envTex=pmrem.fromScene(envScene,0.02).texture;}catch(e){console.warn(e);}

scene.add(new THREE.HemisphereLight(0x9c88b8,0x3a2a22,0.62));
const key=new THREE.DirectionalLight(0xffc896,1.15); key.position.set(4,6,5); key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:20});
key.shadow.bias=-0.0006; key.shadow.normalBias=0.02;
key.target.position.set(0,0.8,-0.6); scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0xff9860,1.35); rim.position.set(-5,3,-9); scene.add(rim);

/* ================= textures ================= */
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c); if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);} t.anisotropy=4; return t;}
const hakamaTex=tex(128,128,(g,w,h)=>{g.fillStyle='#26314f';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=16){g.fillStyle='rgba(185,195,215,.32)';g.fillRect(x,0,2,h);g.fillStyle='rgba(8,10,22,.4)';g.fillRect(x+8,0,3,h);}
  for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.16})`;g.fillRect(Math.random()*w,Math.random()*h,1,3);}},[3,1]);
const tsukaTex=tex(64,128,(g,w,h)=>{g.fillStyle='#17110e';g.fillRect(0,0,w,h);g.fillStyle='#e6dcc4';
  for(let y=0;y<h;y+=32){g.beginPath();g.moveTo(w/2,y+6);g.lineTo(w*0.78,y+16);g.lineTo(w/2,y+26);g.lineTo(w*0.22,y+16);g.closePath();g.fill();}},[2,3]);
const bambooTex=tex(64,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#58762a');gr.addColorStop(.5,'#8cab46');gr.addColorStop(1,'#58762a');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<60;i++){g.fillStyle=`rgba(232,242,192,${Math.random()*.12})`;g.fillRect(Math.random()*w,0,1+Math.random()*2,h);}
  for(let i=0;i<140;i++){g.fillStyle=`rgba(38,48,18,${Math.random()*.16})`;g.fillRect(Math.random()*w,Math.random()*h,1,2+Math.random()*8);}
  const b=g.createLinearGradient(0,0,0,h);b.addColorStop(0,'rgba(240,240,210,.28)');b.addColorStop(.1,'rgba(240,240,210,0)');g.fillStyle=b;g.fillRect(0,0,w,h);},[2,1]);
const groundTex=tex(256,256,(g,w,h)=>{g.fillStyle='#3a2d25';g.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){const l=Math.random();g.fillStyle=l>.5?`rgba(120,95,70,${Math.random()*.25})`:`rgba(10,6,4,${Math.random()*.3})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}},[26,26]);
const kamonTex=tex(128,128,(g)=>{g.strokeStyle='#efe6cf';g.fillStyle='#efe6cf';g.lineWidth=9;g.beginPath();g.arc(64,64,52,0,Math.PI*2);g.stroke();
  g.lineWidth=8;g.beginPath();g.moveTo(54,104);g.lineTo(54,24);g.moveTo(74,104);g.lineTo(74,30);g.stroke();
  [[54,52,-1],[74,64,1],[54,80,-1]].forEach(([x,y,s])=>{g.beginPath();g.ellipse(x+s*16,y-6,18,6,-s*0.6,0,Math.PI*2);g.fill();});});
const leafTex=tex(32,64,(g)=>{g.fillStyle='#fff';g.beginPath();g.moveTo(16,0);g.quadraticCurveTo(30,30,16,64);g.quadraticCurveTo(2,30,16,0);g.fill();});

/* ================= materials ================= */
const std=o=>new THREE.MeshStandardMaterial(o);
const M={
  skin:std({color:0xc98f6a,roughness:.72}), kimono:std({color:0x2b2a31,roughness:.92}),
  hakama:std({map:hakamaTex,roughness:.95,side:THREE.DoubleSide}), white:std({color:0xece6d8,roughness:.85}),
  whiteDS:std({color:0xefe9dc,roughness:.85,side:THREE.DoubleSide}),
  hair:std({color:0x121010,roughness:.55}), obi:std({color:0x7a5426,roughness:.6}),
  lacquer:std({color:0x0f0c0b,roughness:.2,metalness:.2,envMap:envTex}),
  gold:std({color:0xc9a45c,roughness:.3,metalness:.9,envMap:envTex}),
  iron:std({color:0x2e2821,roughness:.42,metalness:.8,envMap:envTex}),
  steel:std({color:0xe9eef3,roughness:.1,metalness:1,envMap:envTex,envMapIntensity:1.5}),
  tsuka:std({map:tsukaTex,roughness:.8}), shu:std({color:0xb8332a,roughness:.7}), eye:std({color:0x0a0808,roughness:.3}),
  kamon:std({map:kamonTex,transparent:true,depthWrite:false,roughness:.6}),
  bamboo:std({map:bambooTex,roughness:.42}), bambooIn:std({color:0xe3d7a2,roughness:.9,side:THREE.BackSide}),
  node:std({color:0x9fb458,roughness:.5}), leaf:std({color:0x5f7d2b,alphaMap:leafTex,alphaTest:.5,side:THREE.DoubleSide,roughness:.7}),
  cut:std({color:0xefe4b2,roughness:.8,side:THREE.DoubleSide}),
  wood:std({color:0x6b4a2e,roughness:.8}), woodDark:std({color:0x46301f,roughness:.85}),
  ground:std({map:groundTex,roughness:1})
};

  const L=[pk(POOL.dir[b]),pk(POOL.ad[b]),pk(POOL.as[b])];
  if(A.stay) L[1]='竹が、斬られたことに気づいてない……';
  else if(sc.sp>=92&&b<=2) L[0]='速い！ 見えなかったぞ';
  if(sc.st<35&&sc.cuts>0) L[1]='刃がブレてますね……';
  if(A.vertical&&sc.cuts>0) L[2]='真っ二つ……！';
  if(sc.cuts===sc.total&&sc.total>=3&&b<=1) L[0]='全部いった！ イケイケだ！';
  if(A.weak) L[1]='竹、無傷っすね';
  if(A.kaguya){L[0]=pk(['……え、かぐや姫？ 回せ回せ、止めるな！','台本にない。……だが、最高だ']);L[1]=pk(['台本にないっす！！','エキストラの方……じゃないっすよね？']);L[2]=pk(['光ってる……きれい……','三寸くらいしかない……！']);}
  else if(A.kaguyaMissed) L[2]='今の竹、根元が光ってませんでした……？';
  return L;
}
const seats=[...document.querySelectorAll('.seat blockquote')];
function say(i,text,ms){const b=seats[i];b.textContent=text;b.classList.add('on');clearTimeout(b._t);if(ms)b._t=setTimeout(()=>b.classList.remove('on'),ms);}
function hush(){seats.forEach(b=>{clearTimeout(b._t);b.classList.remove('on');});}
const IDLE=[[2,'（固唾をのむ）'],[1,'カメラ、回ってます'],[0,'……静かに'],[2,'竹、新品です！'],[1,'本番いきます']];

/* ================= audio ================= */
let AC=null, NB=null;
function audio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const len=AC.sampleRate;NB=AC.createBuffer(1,len,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;}if(AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function envG(g,t0,a,peak,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec);}
function noise(t0,dur,type,f0,f1,peak,q){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=q||1;
  const g=AC.createGain();envG(g,t0,Math.min(0.02,dur*0.3),peak,dur);s.connect(f).connect(g).connect(AC.destination);s.start(t0);s.stop(t0+dur+0.1);}
function tone(t0,type,f0,f1,dur,peak){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  const g=AC.createGain();envG(g,t0,0.005,peak,dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+0.05);}
const sfx={
  whoosh(d,r){if(!AC)return;noise(AC.currentTime,(d+0.12)/r,'bandpass',500*r,3200*r,0.5,1.2);},
  shing(r){if(!AC)return;const t=AC.currentTime;tone(t,'sine',3100*r,2300*r,0.5/r,0.12);tone(t,'triangle',4400*r,3900*r,0.3/r,0.05);noise(t,0.05/r,'highpass',5000,3000,0.35);},
  kon(r){if(!AC)return;const t=AC.currentTime;tone(t,'triangle',560*r,420*r,0.22/r,0.26);tone(t,'sine',280*r,220*r,0.3/r,0.16);},
  thud(){if(!AC)return;const t=AC.currentTime;tone(t,'sine',120,50,0.22,0.28);noise(t,0.08,'lowpass',600,200,0.18);},
  taiko(){if(!AC)return;const t=AC.currentTime;tone(t,'sine',90,48,0.6,0.7);noise(t,0.1,'lowpass',400,120,0.4);tone(t+0.28,'sine',90,48,0.5,0.45);},
  clap(){if(!AC)return;noise(AC.currentTime,0.04,'bandpass',1800,1400,0.7,2);},
  kaguya(r){if(!AC)return;const t=AC.currentTime;[1318.5,1568,1975.5,2637].forEach((f,i)=>tone(t+i*0.09/r,'sine',f*r,f*r*0.998,1.2/r,0.07));noise(t,0.8/r,'highpass',6000,9000,0.05);}
};
Object.keys(sfx).forEach(k=>{const f=sfx[k];sfx[k]=function(){try{f.apply(null,arguments);}catch(e){}};});

/* ================= UI ================= */
const hud={take:$('#take'),best:$('#best')}, slate=$('#slate'), hint=$('#hint'), result=$('#result'), skipBtn=$('#skip'), tc=$('#tc'), flashEl=$('#flash');
function setState(s){game.state=s;document.body.dataset.state=s;}
function updateHud(){hud.take.textContent=`シーン${game.scene}　テイク${game.take}`;hud.best.textContent=`自己ベスト　${store.best||'—'}`+(store.kaguya?`　姫 ${store.kaguya}`:'');}
function flash(o){if(RM)o*=0.4;flashEl.style.transition='none';flashEl.style.opacity=o;void flashEl.offsetWidth;flashEl.style.transition='opacity .4s';flashEl.style.opacity=0;}
const grade=s=>s>=90?'免許皆伝':s>=75?'達人':s>=60?'師範代':s>=40?'門下生':'代役候補';
const pad=n=>String(n).padStart(2,'0');
function startTake(){
  const tok=++game.token; setState('slate'); result.classList.remove('show'); document.body.classList.remove('cine');
  skipBtn.hidden=true; hush(); game.A=null;
  game.kaguyaIdx=game.forceKaguya?0:(Math.random()<0.03?Math.floor(Math.random()*SCENES[game.scene-1].n):-1); game.forceKaguya=false;
  $('#rWaza').style.color=''; buildStage(); updateHud(); resetTrail();
  hint.textContent='画面をなぞって、斬る';
  slate.textContent=`シーン${game.scene}　テイク${game.take}`; slate.classList.add('on');
  setTimeout(()=>{if(tok===game.token) slate.textContent='よーい……';},900);
  setTimeout(()=>{if(tok===game.token){sfx.clap();slate.textContent='スタート！';}},1700);
  setTimeout(()=>{if(tok!==game.token)return;slate.classList.remove('on');setState('ready');hint.classList.add('on');},2300);
  setTimeout(()=>{if(tok!==game.token||game.state!=='ready')return;const l=IDLE[Math.floor(Math.random()*IDLE.length)];say(l[0],l[1],2200);},3600);
}
function startReplay(){
  const A=game.A; setState('replay'); buildStage(); resetTrail();
  Object.assign(A,{t:0,phi:-9,sWhoosh:false,firstCut:false,bumped:false,crewFired:false,cutDone:new Set()});
  game.rng=mulberry(A.seed); game.simAcc=0; game.hitStop=0; game.rclock=0;
  hush(); document.body.classList.add('cine'); skipBtn.hidden=false; sfx.taiko();
}
function fireCrew(){
  const A=game.A, tok=game.token; A.crewFired=true;
  A.lines.forEach((l,i)=>setTimeout(()=>{if(tok===game.token&&game.state==='replay')say(i,l);},i*1000));
}
function endReplay(){
  const tok=game.token; setState('verdict'); document.body.classList.remove('cine'); skipBtn.hidden=true;
  setTimeout(()=>{if(tok===game.token)showResult();},900);
}
function showResult(){
  const A=game.A, sc=A.sc; hush(); document.body.classList.remove('cine'); skipBtn.hidden=true; setState('verdict');
  $('#rWaza').textContent=A.waza; $('#rScore').textContent=sc.score; $('#rGrade').textContent=grade(sc.score);
  const rows=[['鋭さ',sc.sp],['迷いのなさ',sc.st],['角度の美',sc.an],['踏み込み',sc.ln]];
  $('#rStats').innerHTML=rows.map(([k,v])=>`<dt>${k}</dt><dd><i><span style="width:${Math.round(v)}%"></span></i><b>${Math.round(v)}</b></dd>`).join('')
    +`<dt>斬った竹</dt><dd><b style="width:auto">${sc.cuts} / ${sc.total}</b></dd>`
    +(A.kaguya?`<dt>かぐや姫</dt><dd><b style="width:auto;color:var(--shu)">出現！ +15</b></dd>`:'');
  if(A.kaguya){$('#rGrade').textContent='竹取の翁'; if(!A.counted){A.counted=true;store.kaguya=(store.kaguya||0)+1;}}
  const who=[['監','監督'],['助','助監督'],['ア','アシスタント']];
  $('#rCrew').innerHTML=A.lines.map((l,i)=>`<li><span class="face f${i}">${who[i][0]}</span><p><b>${who[i][1]}</b>${l}</p></li>`).join('');
  $('#next').textContent=game.scene<SCENES.length?'次のシーンへ':'シーン1へ戻る';
  if(sc.score>store.best)store.best=sc.score; saveBest();
  updateHud(); result.classList.add('show');
}
$('#start').addEventListener('click',()=>{audio();$('#title').classList.add('gone');startTake();});
$('#again').addEventListener('click',()=>{audio();game.take++;startTake();});
$('#next').addEventListener('click',()=>{audio();game.scene=game.scene%SCENES.length+1;game.take=1;startTake();});
let sealTaps=0;
const secret=el=>{if(++sealTaps>=3){sealTaps=0;game.forceKaguya=true;el.style.color='#c9a45c';}};
$('.seal').addEventListener('click',e=>secret(e.currentTarget));
$('#rWaza').addEventListener('click',e=>secret(e.currentTarget));
skipBtn.addEventListener('click',()=>{if(game.state!=='replay')return;game.token++;showResult();});

/* ================= input ================= */
const ink=$('#ink'), ictx=ink.getContext('2d'); let stroke=null;
function sizeInk(){const d=Math.min(window.devicePixelRatio||1,2);ink.width=innerWidth*d;ink.height=innerHeight*d;ictx.setTransform(d,0,0,d,0,0);}
function drawSeg(a,b){const v=Math.hypot(b.x-a.x,b.y-a.y)/Math.max(1,b.t-a.t);ictx.lineCap='round';ictx.strokeStyle='rgba(255,238,210,.92)';
  ictx.shadowColor='rgba(255,160,80,.95)';ictx.shadowBlur=18;ictx.lineWidth=clamp(16-v*4,3,16);ictx.beginPath();ictx.moveTo(a.x,a.y);ictx.lineTo(b.x,b.y);ictx.stroke();ictx.shadowBlur=0;}
function slashLine(sw){const dx=sw.b.x-sw.a.x, dy=sw.b.y-sw.a.y, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, e=Math.max(innerWidth,innerHeight);
  ictx.save();ictx.lineCap='round';ictx.shadowColor='rgba(255,220,170,1)';ictx.shadowBlur=24;ictx.strokeStyle='rgba(255,255,245,.95)';ictx.lineWidth=3;
  ictx.beginPath();ictx.moveTo(sw.a.x-ux*e,sw.a.y-uy*e);ictx.lineTo(sw.b.x+ux*e,sw.b.y+uy*e);ictx.stroke();ictx.restore();}
const ts=e=>e.timeStamp||performance.now();
function goReady(){game.token++;slate.classList.remove('on');setState('ready');hint.classList.add('on');}
['touchstart','touchmove'].forEach(t=>ink.addEventListener(t,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
document.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault();},{passive:false});
ink.addEventListener('pointerdown',e=>{if(game.state==='slate')goReady();if(game.state!=='ready')return;audio();e.preventDefault();try{ink.setPointerCapture(e.pointerId);}catch(_){}
  stroke={id:e.pointerId,pts:[{x:e.clientX,y:e.clientY,t:ts(e)}]};game.pressing=true;});
ink.addEventListener('pointermove',e=>{if(!stroke||e.pointerId!==stroke.id)return;const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  for(const ev of evs){const p={x:ev.clientX,y:ev.clientY,t:ts(ev)},prev=stroke.pts[stroke.pts.length-1];if(p.t<=prev.t)p.t=prev.t+1;stroke.pts.push(p);drawSeg(prev,p);}});
function finish(e){
  if(!stroke||e.pointerId!==stroke.id)return; game.pressing=false; const pts=stroke.pts; stroke=null;
  if(game.state!=='ready'||pts.length<2)return;
  const sw=analyze(pts);
  if(sw.len/Math.min(innerWidth,innerHeight)<0.08){hint.textContent='もっと長く、なぞって斬る';return;}
  hint.classList.remove('on'); hush(); resetTrail();
  game.A=makeAction(sw); game.rng=mulberry(game.A.seed); game.simAcc=0; game.hitStop=0; setState('action');
}
ink.addEventListener('pointerup',finish);
ink.addEventListener('pointercancel',e=>{if(stroke&&e.pointerId===stroke.id){stroke=null;game.pressing=false;}});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ================= camera ================= */
const LOOK=new V3(0.1,1.05,-0.75), CAMOFF=new V3(3.0,0.42,2.4); let camDist=1; const camLook=LOOK.clone(), tp=new V3();
function fit(){
  const w=innerWidth,h=innerHeight,asp=w/h,t16=Math.tan(THREE.MathUtils.degToRad(16));
  let v=THREE.MathUtils.radToDeg(2*Math.atan(t16/asp)); camDist=1;
  if(v>58){camDist=(t16/asp)/Math.tan(THREE.MathUtils.degToRad(29));v=58;}
  camera.fov=Math.max(36,v); camera.aspect=asp; camera.updateProjectionMatrix();
  renderer.setSize(w,h); sizeInk();
}
function replayCam(A){
  const t=A.t, head=SAM.head.getWorldPosition(new V3());
  if(t<TW-0.04){camera.position.copy(head).add(new V3(0.5,-0.06,0.62));camera.lookAt(head.x,head.y-0.02,head.z);}
  else if(t<A.t2+0.55){const ang=0.25+(t-TW)*1.4, tg=A.focus;camera.position.set(tg.x+Math.sin(ang)*1.35,tg.y+0.12,tg.z+Math.cos(ang)*1.35);camera.lookAt(tg);}
  else if(A.kaguya&&KG.state){const gp=KG.group.position;camera.position.set(gp.x+0.26,gp.y+0.06,gp.z+0.3);camera.lookAt(gp.x,gp.y+0.045,gp.z);}
  else{const k=t-A.t2;camera.position.copy(LOOK).add(new V3(-2.1,-0.6,2.5).multiplyScalar(camDist)).add(new V3(0.15*k,0,-0.12*k));camera.lookAt(LOOK);}
}
function updateCam(rdt){
  const st=game.state;
  if(st==='replay'){replayCam(game.A);return;}
  const k=1-Math.pow(0.002,rdt);
  if(st==='title'){const a=game.clock*0.12+0.6;tp.set(Math.sin(a)*3.4,1.35+Math.sin(game.clock*0.2)*0.1,-1+Math.cos(a)*3.4);
    camera.position.lerp(tp,k);camLook.lerp(new V3(0,1.15,-1),k);camera.lookAt(camLook);return;}
  tp.copy(LOOK).addScaledVector(CAMOFF,camDist*(st==='action'?0.93:1));
  camera.position.lerp(tp,k); camLook.lerp(LOOK,k); camera.lookAt(camLook);
  if(game.shake>0.0005){camera.position.x+=(Math.random()-.5)*game.shake;camera.position.y+=(Math.random()-.5)*game.shake;game.shake*=Math.pow(0.02,rdt);}
}

/* ================= loop ================= */
let errShown=false;
function loop(now){
  requestAnimationFrame(loop);
  try{ frame(now); }catch(e){ if(!errShown){errShown=true;window.__showErr(e.message);console.error(e);} }
}
function frame(now){
  const rdt=Math.min(0.05,(now-(game.last||now))/1000); game.last=now; game.clock+=rdt;
  const st=game.state, A=game.A;
  if((st==='action'||st==='replay')&&A){
    if(game.hitStop>0) game.hitStop-=rdt;
    else{
      let sc=1;
      if(st==='replay'){const t=A.t;sc=t<TW-0.06?0.55:t<A.t2+0.35?0.13:t<A.t2+0.9?0.35:0.8; if(A.kaguya&&t>=A.t2+0.55)sc=0.35;}
      game.simAcc+=rdt*sc; let n=0; while(game.simAcc>=DT&&n<48){simStep(DT);game.simAcc-=DT;n++;}
    }
    if(st==='replay'){game.rclock+=rdt;const s=game.rclock;tc.textContent=`00:${pad(Math.floor(s/60))}:${pad(Math.floor(s)%60)}:${pad(Math.floor(s*24)%24)}`;
      if(A.t>=A.t2&&!A.crewFired) fireCrew(); if(A.t>=A.tEnd) endReplay();}
    else if(A.t>=A.tEnd+0.35) startReplay();
  }else if(st!=='verdict'){
    game.tame=game.pressing?Math.min(1,game.tame+rdt*2.5):Math.max(0,game.tame-rdt*3);
    applyPose(kamaePose(game.clock,game.tame));
  }
  trailUpdate(); animTails(game.clock);
  if(KG.state){
    if(!KG.state.revealed) KG.ring.material.opacity=0.07+0.06*Math.sin(game.clock*2.2);
    else{
      KG.ring.material.opacity=0.3; const gp=KG.group.position;
      const want=Math.atan2(camera.position.x-gp.x,camera.position.z-gp.z); KG.group.rotation.y+=(want-KG.group.rotation.y)*Math.min(1,rdt*2);
      for(let i=0;i<KG.spN;i++){const a=i*2.39+game.clock*(0.8+(i%3)*0.3), u=(game.clock*0.25+i/KG.spN)%1, r=0.05+0.05*u;
        KG.spPos[i*3]=gp.x+Math.cos(a)*r; KG.spPos[i*3+1]=gp.y+u*0.2; KG.spPos[i*3+2]=gp.z+Math.sin(a)*r;}
      KG.spark.geometry.attributes.position.needsUpdate=true;
    }
  }
  for(let i=0;i<leafN;i++){const v=leafVel[i];leafPos[i*3+1]-=v.s*rdt;leafPos[i*3]+=Math.sin(game.clock*0.8+v.p)*0.2*rdt;if(leafPos[i*3+1]<0){leafPos[i*3+1]=5;}}
  leafGeoP.attributes.position.needsUpdate=true;
  ictx.save();ictx.setTransform(1,0,0,1,0,0);ictx.globalCompositeOperation='destination-out';ictx.fillStyle=`rgba(0,0,0,${Math.min(1,rdt*(stroke?1.2:3.2))})`;
  ictx.fillRect(0,0,ink.width,ink.height);ictx.restore();
  updateCam(rdt);
  renderer.render(scene,camera);
}
addEventListener('resize',fit);
fit(); buildStage(); updateHud(); applyPose(kamaePose(0,0)); camera.position.set(3,1.5,1.5); camera.lookAt(LOOK);
requestAnimationFrame(loop);
})();
</script>
